version: '3.8'

services:
 backend:
 image: frappe/erpnext:${ERPNEXT_VERSION:-v15.38.0}
 restart: unless-stopped
 environment:
 - DB_HOST=${DB_HOST:-mariadb}
 - DB_PORT=${DB_PORT:-3306}
 - REDIS_CACHE=${REDIS_CACHE_HOST:-redis-cache}:6379
 - REDIS_QUEUE=${REDIS_QUEUE_HOST:-redis-queue}:6379
 - REDIS_SOCKETIO=${REDIS_SOCKETIO_HOST:-redis-socketio}:6379
 - SOCKETIO_PORT=9000
 volumes:
 - sites-vol:/home/frappe/frappe-bench/sites
 - logs-vol:/home/frappe/frappe-bench/logs
 depends_on:
 mariadb:
 condition: service_healthy
 redis-cache:
 condition: service_started
 redis-queue:
 condition: service_started

 frontend:
 image: frappe/erpnext:${ERPNEXT_VERSION:-v15.38.0}
 restart: unless-stopped
 command:
 - nginx-entrypoint.sh
 environment:
 - BACKEND=backend:8000
 - FRAPPE_SITE_NAME_HEADER=${FRAPPE_SITE_NAME_HEADER:-erp.local}
 - SOCKETIO=websocket:9000
 - UPSTREAM_REAL_IP_ADDRESS=127.0.0.1
 - UPSTREAM_REAL_IP_HEADER=X-Forwarded-For
 - UPSTREAM_REAL_IP_RECURSIVE=off
 - PROXY_READ_TIMEOUT=120
 - CLIENT_MAX_BODY_SIZE=50m
 volumes:
 - sites-vol:/home/frappe/frappe-bench/sites
 - logs-vol:/home/frappe/frappe-bench/logs
 ports:
 - "${ROUTER_PORT:-80}:8080"
 depends_on:
 - backend
 - websocket

 websocket:
 image: frappe/erpnext:${ERPNEXT_VERSION:-v15.38.0}
 restart: unless-stopped
 command:
 - node
 - /home/frappe/frappe-bench/apps/frappe/socketio.js
 environment:
 - REDIS_SOCKETIO=${REDIS_SOCKETIO_HOST:-redis-socketio}:6379
 volumes:
 - sites-vol:/home/frappe/frappe-bench/sites
 - logs-vol:/home/frappe/frappe-bench/logs
 depends_on:
 - redis-socketio

 queue-default:
 image: frappe/erpnext:${ERPNEXT_VERSION:-v15.38.0}
 restart: unless-stopped
 command:
 - bench
 - worker
 - --queue
 - default
 volumes:
 - sites-vol:/home/frappe/frappe-bench/sites
 - logs-vol:/home/frappe/frappe-bench/logs
 depends_on:
 - redis-queue

 queue-short:
 image: frappe/erpnext:${ERPNEXT_VERSION:-v15.38.0}
 restart: unless-stopped
 command:
 - bench
 - worker
 - --queue
 - short
 volumes:
 - sites-vol:/home/frappe/frappe-bench/sites
 - logs-vol:/home/frappe/frappe-bench/logs
 depends_on:
 - redis-queue

 queue-long:
 image: frappe/erpnext:${ERPNEXT_VERSION:-v15.38.0}
 restart: unless-stopped
 command:
 - bench
 - worker
 - --queue
 - long
 volumes:
 - sites-vol:/home/frappe/frappe-bench/sites
 - logs-vol:/home/frappe/frappe-bench/logs
 depends_on:
 - redis-queue

 scheduler:
 image: frappe/erpnext:${ERPNEXT_VERSION:-v15.38.0}
 restart: unless-stopped
 command:
 - bench
 - schedule
 volumes:
 - sites-vol:/home/frappe/frappe-bench/sites
 - logs-vol:/home/frappe/frappe-bench/logs
 depends_on:
 - redis-queue

 mariadb:
 image: mariadb:10.6
 restart: unless-stopped
 command:
 - --character-set-server=utf8mb4
 - --collation-server=utf8mb4_unicode_ci
 - --skip-character-set-client-handshake
 - --skip-innodb-read-only-compressed
 environment:
 - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-mariadb_root_secret_password}
 volumes:
 - db-data:/var/lib/mysql
 - ./configs/mariadb.cnf:/etc/mysql/conf.d/frappe.cnf
 healthcheck:
 test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-mariadb_root_secret_password}"]
 interval: 5s
 timeout: 5s
 retries: 10

 redis-cache:
 image: redis:alpine
 restart: unless-stopped
 volumes:
 - redis-cache-data:/data

 redis-queue:
 image: redis:alpine
 restart: unless-stopped
 volumes:
 - redis-queue-data:/data

 redis-socketio:
 image: redis:alpine
 restart: unless-stopped
 volumes:
 - redis-socketio-data:/data

volumes:
 db-data:
 redis-cache-data:
 redis-queue-data:
 redis-socketio-data:
 sites-vol:
 logs-vol:
